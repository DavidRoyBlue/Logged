name: CI
on:
  push: { branches: [main, master] }
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from "packageManager" field in root package.json (pnpm@10.15.0)
      # Do NOT pass version: here — providing both causes a "multiple versions" conflict.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - uses: supabase/setup-cli@v1
        with: { version: 2.104.0 }
      - run: supabase start
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Export local Supabase env
        # `supabase status -o env` (v2.104.0) emits: API_URL, ANON_KEY, SERVICE_ROLE_KEY
        # services/worker's integration tests read: SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY
        # We remap here so the names match what the tests expect.
        run: |
          eval "$(pnpm exec supabase status -o env)"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
        shell: bash
      - run: pnpm -r --filter '!@logged/db-tests' test

  db-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from "packageManager" field in root package.json (pnpm@10.15.0)
      # Do NOT pass version: here — providing both causes a "multiple versions" conflict.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - uses: supabase/setup-cli@v1
        with: { version: 2.104.0 }
      - run: supabase start
      - run: pnpm install --frozen-lockfile
      - name: Export local Supabase env
        # `supabase status -o env` (v2.104.0) emits: API_URL, ANON_KEY, SERVICE_ROLE_KEY
        # The db-tests helper (supabase/tests/helpers.ts) reads: SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY
        # We remap here so the names match what the helper expects.
        run: |
          eval "$(pnpm exec supabase status -o env)"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
        shell: bash
      - run: pnpm --filter @logged/db-tests test

  agents-config:
    name: Agent config drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Inline copy of the agents-drift-check contract (kept self-contained):
      # CLAUDE.md = @AGENTS.md shim + sibling AGENTS.md; extra content only
      # below <!-- claude-only -->; skills in .claude/skills are symlinks.
      - name: CLAUDE.md files are @AGENTS.md shims
        run: |
          fail=0
          find . \( -name .git -o -name node_modules -o -name .claude \) -prune \
            -o \( -name CLAUDE.md -o -name AGENTS.md \) -print | sort -u > /tmp/agentfiles
          while IFS= read -r f; do
            dir=$(dirname "$f")
            case "$(basename "$f")" in
              CLAUDE.md)
                [ -f "$dir/AGENTS.md" ] || { echo "::error file=$f::no sibling AGENTS.md"; fail=1; }
                first=$(grep -m1 -v '^[[:space:]]*$' "$f" || true)
                [ "$first" = "@AGENTS.md" ] || { echo "::error file=$f::not an @AGENTS.md shim"; fail=1; }
                stray=$(sed '/<!-- claude-only -->/,$d' "$f" | grep -v '^[[:space:]]*$' | grep -vcx '@AGENTS.md' || true)
                [ "$stray" = 0 ] || { echo "::error file=$f::content outside claude-only section"; fail=1; }
                ;;
              AGENTS.md)
                [ -f "$dir/CLAUDE.md" ] || { echo "::error file=$f::AGENTS.md without CLAUDE.md shim"; fail=1; }
                ;;
            esac
          done < /tmp/agentfiles
          if [ -d .claude/skills ]; then
            for entry in .claude/skills/*; do
              [ -e "$entry" ] || [ -L "$entry" ] || continue
              [ -L "$entry" ] && [ -e "$entry" ] || { echo "::error file=$entry::skill must be a resolving symlink into .agents/skills"; fail=1; }
            done
          fi
          exit $fail
